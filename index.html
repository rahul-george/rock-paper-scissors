<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- header -->
    <header>
      <div>
        <h1>Rock Paper Scissors</h1>
        <p>✊ ✋ ✌️</p>
      </div>
    </header>

    <article name="game">
      <section name="stats" class="scorecard">
        <div>
          <div class="player">
            <span class="player_score">
              You:
              <span id="human_score">0</span>
            </span>
            <span id="human_choice" class="player_choice">❔</span>
          </div>
          <div class="player">
            <span class="player_score">
              Computer:
              <span id="computer_score">0</span>
            </span>
            <span id="computer_choice" class="player_choice">❔</span>
          </div>
        </div>
        <p id="game_message">Start a game! First player to reach 5 wins!</p>
      </section>
      <section name="controls" class="current_game">
        <div class="game_controls">
          <button class="game_control">
            <span data-value="0" id="rock_button">✊</span>
          </button>
          <button class="game_control">
            <span data-value="1" id="paper_button">✋</span>
          </button>
          <button class="game_control">
            <span data-value="2" id="scissors_button">✌️</span>
          </button>
        </div>
        <div class="restart_game">
          <button class="restart" id="restart">New Game</button>
        </div>
      </section>
      <section name="history" class="commentary">
        <h1>Commentary</h1>
        <ul class="game_history"></ul>
      </section>
    </article>

    <!-- footer -->
    <footer>
      <span>
        ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Rahul George. All rights reserved.
      </span>
    </footer>
    <script src="./main.js"></script>
  </body>
</html>
