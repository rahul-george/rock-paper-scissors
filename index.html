<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Document</title>
  </head>
  <body>
    <!-- Game Frame -->
    <div class="game_frame">
      <!-- Title Block -->
      <header>
        <h1>Rock Paper Scissors</h1>
      </header>

      <!-- Score Card -->
      <section class="scorecard">
        <div class="player">
          <p class="player_name">You</p>
          <p class="player_score" id="human_score">0</p>
        </div>
        <div class="player">
          <p class="player_name">Computer</p>
          <p class="player_score" id="computer_score">0</p>
        </div>
      </section>

      <!-- Current Game -->
      <section class="current_game">
        <section></section>
        <div class="game_controls">
          <button class="game_control" id="rock_button">
            <span data-value="0">✊</span>
          </button>
          <button class="game_control" id="paper_button">
            <span data-value="1">✋</span>
          </button>
          <button class="game_control" id="scissors_button">
            <span data-value="2">✌️</span>
          </button>
        </div>
        <div class="restart_game">
          <button class="restart" id="restart">New Game</button>
        </div>
        <!-- Commentary -->
        <section class="commentary">
          <h1>Commentary</h1>
          <ul class="game_history"></ul>
        </section>
      </section>

      <!-- Footer - Copyright -->
      <footer>
        ©
        <script>
          document.write(new Date().getFullYear());
        </script>
        Rahul George. All rights reserved.
      </footer>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
